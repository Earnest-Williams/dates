name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run audit:actions
    - run: npm run validate:content
    - name: Run tests
      run: bash scripts/run-tests.sh
      env:
        NODE_OPTIONS: '--max-old-space-size=8192'
